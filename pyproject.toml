[project]
name = "file-tools"
description = "Unified CLI for file organization, LLM-assisted tagging, and bulk renaming."
authors = [
    { name = "Kris Armstrong", email = "kris.armstrong@example.com" }
]
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment :: File Managers",
]
dependencies = [
    "rich>=13.7",
    "python-magic>=0.4",
    "Pillow>=10.2",
    "keyring>=25.0",
]

dynamic = ["version"]

[project.optional-dependencies]
llm = [
    "openai>=1.35",
    "httpx>=0.27",
]
test = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "coverage[toml]>=7.4",
]
dev = [
    "nox>=2024.4.15",
]

[project.urls]
Homepage = "https://github.com/krisarmstrong/file-tools"
"Bug Tracker" = "https://github.com/krisarmstrong/file-tools/issues"

[project.scripts]
file-tools = "file_tools.__main__:main"

[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/file_tools/_version.py"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
addopts = "-ra --showlocals"
testpaths = ["file_tools/tests"]

[tool.coverage.run]
source = ["file_tools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
