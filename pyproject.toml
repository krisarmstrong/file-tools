[project]
name = "file-tools"
version = "1.0.3"
description = "Unified CLI for file organization and bulk renaming."
authors = [
    { name = "Kris Armstrong", email = "kris.armstrong@me.com" }
]
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment :: File Managers",
]
dependencies = [
    "rich>=15.0.0",
    "python-magic>=0.4",
    "Pillow>=10.2",
    "keyring>=25.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "coverage[toml]>=7.4",
]
dev = [
    "nox>=2024.4.15",
]

[project.urls]
Homepage = "https://github.com/krisarmstrong/file-tools"
"Bug Tracker" = "https://github.com/krisarmstrong/file-tools/issues"

[project.scripts]
file-tools = "file_tools.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["file_tools*"]

[tool.pytest.ini_options]
addopts = "-ra --showlocals"
testpaths = ["tests"]

[tool.coverage.run]
source = ["file_tools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
extend-exclude = ["build", "dist", ".venv", "venv", ".tox", ".mypy_cache", ".ruff_cache"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
